<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Invitation</title>
<style>body{margin:0;background:#f8f4ec;color:#4b2436;font-family:Georgia,serif}.wrap{max-width:760px;margin:30px auto;padding:18px;text-align:center}.paper{background:#fffdf8;padding:24px;border:1px solid #e4d7c9;border-radius:12px}.env{margin:20px auto;width:min(100%,520px);aspect-ratio:1.35;position:relative;overflow:hidden;box-shadow:0 16px 40px #0002}.liner{position:absolute;inset:0 5% 8%;clip-path:polygon(0 0,100% 0,50% 78%)}.front{position:absolute;inset:35% 0 0;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}.flap{position:absolute;top:0;width:100%;height:53%;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s}.env.open .flap{transform:rotateX(180deg)}.seal{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);background:#f7eee2;width:70px;height:70px;border-radius:50%;display:grid;place-items:center}.inv{display:none;margin:20px auto}.inv iframe{width:100%;height:75vh;border:0}.btn{background:#4b2436;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}.joy{margin:20px}.joy a{color:#4b2436}</style></head><body><main class="wrap"><div class="paper"><h1 id="title">You are invited</h1><div class="env" id="env"><div class="liner" id="liner"></div><div class="front" id="front"></div><div class="flap" id="flap"></div><div class="seal" id="seal">♡</div></div><button class="btn" id="open">Open invitation</button><section class="inv" id="inv"><div id="pdf"></div><div class="joy" id="joy"></div></section><p id="err"></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={url:"PASTE_SUPABASE_PROJECT_URL",key:"PASTE_SUPABASE_ANON_KEY"};
(async()=>{let id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("err").textContent="Invitation link is missing.";return}
if(!CONFIG.url.startsWith("https://")||CONFIG.key.startsWith("PASTE_")){document.getElementById("err").textContent="Invitation service is not configured.";return}
let sb=window.supabase.createClient(CONFIG.url,CONFIG.key);
let {data,error}=await sb.from("invitations").select("title,monogram,envelope_color,pattern,joy_url,joy_label,pdf_path").eq("public_slug",id).eq("is_published",true).single();
if(error||!data){document.getElementById("err").textContent="This invitation link is unavailable.";return}
let d=data;document.getElementById("title").textContent=d.title||"You are invited";document.getElementById("seal").textContent=d.monogram||"♡";
let patternCss=({plain:"linear-gradient(#d8c5aa,#d8c5aa)",floral:"radial-gradient(circle at 25% 30%,#d6a7ad 0 8%,transparent 9%),radial-gradient(circle at 70% 55%,#9fa77d 0 10%,transparent 11%),#f2e8dc",botanical:"repeating-linear-gradient(45deg,#9ca77d 0 2px,transparent 2px 12px),#f3eadb",dots:"radial-gradient(#6b263f 1.5px,transparent 2px),#f3e8da",stripes:"repeating-linear-gradient(45deg,#b8bd91 0 8px,#f4e9da 8px 16px",linen:"repeating-linear-gradient(0deg,#ddd2c4 0 1px,#e8ded2 1px 3px)",gold:"radial-gradient(circle,#c9a65f 1px,transparent 2px),#f2e5d0",vintage:"radial-gradient(ellipse at center,#e2c4ba 0 20%,transparent 21%),#f2e7d6"})[d.pattern]||"#f2e8dc";
document.getElementById("env").style.background=d.envelope_color||"#b7bd91";document.getElementById("front").style.background=d.envelope_color||"#b7bd91";document.getElementById("flap").style.background=d.envelope_color||"#b7bd91";document.getElementById("liner").style.background=patternCss;
if(d.pdf_path){let {data:obj}=sb.storage.from("invite-files").getPublicUrl(d.pdf_path);document.getElementById("pdf").innerHTML=`<iframe title="Wedding invitation" src="${obj.publicUrl}"></iframe>`}
if(d.joy_url){let a=document.createElement("a");a.href=d.joy_url;a.target="_blank";a.rel="noopener";a.textContent=d.joy_label||"View Wedding Details";document.getElementById("joy").append(a)}
document.getElementById("open").onclick=()=>{document.getElementById("env").classList.add("open");document.getElementById("open").style.display="none";setTimeout(()=>{document.getElementById("env").style.display="none";document.getElementById("inv").style.display="block"},900)}
})();
</script></body></html>
